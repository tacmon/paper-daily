name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Initialize without network
        run: python scripts/init_library.py
      - name: Archive and reading state
        run: python -m unittest discover -p 'test_*.py'
      - name: Discovery and retrieval
        run: python -m unittest discover -s prototype_v2 -p 'test_*.py'
      - name: Validate empty archive
        run: python paper_library.py validate
